name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Build all platforms
        run: |
          mkdir -p dist
          bun build ./src/index.ts --compile --target=bun-darwin-arm64 --outfile ./dist/octo-macos-arm64
          bun build ./src/index.ts --compile --target=bun-darwin-x64 --outfile ./dist/octo-macos-x64
          bun build ./src/index.ts --compile --target=bun-linux-x64 --outfile ./dist/octo-linux-x64
          bun build ./src/index.ts --compile --target=bun-linux-arm64 --outfile ./dist/octo-linux-arm64
          bun build ./src/index.ts --compile --target=bun-windows-x64 --outfile ./dist/octo-windows-x64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          generate_release_notes: true
